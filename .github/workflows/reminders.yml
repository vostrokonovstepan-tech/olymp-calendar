name: Напоминания об олимпиадах

on:
  schedule:
    # GitHub cron uses UTC: 04:00 UTC = 07:00 Moscow, every day.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только проверить, без отправки в Telegram'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/reminders.yml'

permissions:
  contents: read

concurrency:
  group: olympiad-reminders
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/remind.test.mjs
      - run: node scripts/remind.mjs --dry-run

  notify:
    if: github.event_name != 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Напомнить о начале и окончании завтрашних этапов
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/remind.mjs
